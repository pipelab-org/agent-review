# Trusted engine policy. Read only from the immutable shared-engine source.
# max_turns and max_budget_usd have no code defaults; each review_depth table
# must set both or inference is refused.
# Values below were approved by the owner on 2026-10-28 from a measured
# evaluation run: the heaviest Sonnet pass used about 170k tokens and 20 tool
# steps, the heaviest Opus pass about 170k tokens and 19 steps. Caps are about
# twice that, priced from https://platform.claude.com/docs/en/about-claude/pricing
# (Sonnet 5.5 $2/$10, Opus 5.5 $4/$20 per million input/output tokens).
# Codex caps follow the same token allowance priced from
# https://developers.openai.com/api/docs/pricing (checked 2026-10-29):
# gpt-6.1-sol $2/$10 matches Sonnet, so USD 2; gpt-6-astra $10/$50 is five
# times Sonnet, so USD 10. Model choice follows OpenAI's Codex model guide,
# https://learn.chatgpt.com/docs/models : Sol for repeated heavy coding work,
# Astra for the hardest tasks (start at low effort). Pending their own measurement.
[config]
max_model_tokens = 90000
max_output_tokens = 16000
ai_timeout = 300

[review_depth.default]
model = "anthropic/claude-sonnet-5-5"
reasoning_effort = "medium"
max_turns = 40
max_budget_usd = 2.0

[review_depth.deep]
model = "anthropic/claude-opus-5-5"
reasoning_effort = "high"
max_turns = 40
max_budget_usd = 4.0

[review_depth.codex]
model = "gpt-6.1-sol"
reasoning_effort = "medium"
max_turns = 40
max_budget_usd = 2.0

[review_depth.codex-deep]
model = "gpt-6-astra"
reasoning_effort = "low"
max_turns = 40
max_budget_usd = 10.0
