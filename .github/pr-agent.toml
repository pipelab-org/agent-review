# Trusted engine policy. Read only from the immutable shared-engine source.
# No turn/dollar defaults. Owner-approved measurements must supply both keys
# max_turns and max_budget_usd in EACH review_depth table before inference.
[config]
max_model_tokens = 90000
max_output_tokens = 16000
ai_timeout = 300

[review_depth.default]
model = "anthropic/claude-sonnet-5-5"
reasoning_effort = "medium"
# max_turns and max_budget_usd are required operator settings, intentionally absent.

[review_depth.deep]
model = "anthropic/claude-opus-5-5"
reasoning_effort = "high"
# max_turns and max_budget_usd are required operator settings, intentionally absent.

[review_depth.codex]
model = "gpt-6-luna"
reasoning_effort = "medium"
# max_turns and max_budget_usd are required operator settings, intentionally absent.
