# Trusted engine policy. Read only from the immutable shared-engine source.
# max_turns and max_budget_usd have no code defaults; each review_depth table
# must set both or inference is refused.
# Values below were approved by the owner on 2026-10-28 from a measured
# evaluation run: the heaviest Sonnet pass used about 170k tokens and 20 tool
# steps, the heaviest Opus pass about 170k tokens and 19 steps. Caps are about
# twice that, priced from https://platform.claude.com/docs/en/about-claude/pricing
# (Sonnet 5.5 $2/$10, Opus 5.5 $4/$20 per million input/output tokens).
# Codex uses gpt-6.1-terra (owner choice, 2026-10-29) at
# https://developers.openai.com/api/docs/pricing rates (checked 2026-10-29):
# $1/$5, half of Sonnet, so the same token allowance is USD 1 per pass.
# codex-deep runs xhigh effort; Artificial Analysis reports Terra using about
# twice the tokens at its higher efforts, so its pass gets USD 2.
# Effort values: https://developers.openai.com/api/docs/models/gpt-6.1-terra .
# Pending their own measurement.
# max_model_tokens is the largest allowance billed at standard rates by both
# providers: OpenAI bills above 272K input tokens at long-context rates
# (https://developers.openai.com/api/docs/pricing), and Claude 4.6+ models other
# than Haiku 5.5 bill their full 1M window at standard rates
# (https://platform.claude.com/docs/en/about-claude/pricing#long-context-pricing).
# At 90000, Pipelock changes touching its largest files could not be reviewed.
[config]
max_model_tokens = 272000
max_output_tokens = 16000
ai_timeout = 300

# High effort: at medium, Sonnet answered from the bundle in 2-7 turns and opened 0-2 files;
# at high it traced producers and consumers (10-37 turns) and recall rose from 2/6 to 5/6 on
# historical known-bug changes while each review stayed between $0.09 and $1.73.
[review_depth.default]
model = "anthropic/claude-sonnet-5-5"
reasoning_effort = "high"
max_turns = 40
max_budget_usd = 2.0

[review_depth.deep]
model = "anthropic/claude-opus-5-5"
reasoning_effort = "high"
max_turns = 40
max_budget_usd = 4.0

[review_depth.codex]
model = "gpt-6.1-terra"
reasoning_effort = "medium"
max_turns = 40
max_budget_usd = 1.0

[review_depth.codex-deep]
model = "gpt-6.1-terra"
reasoning_effort = "xhigh"
max_turns = 40
max_budget_usd = 2.0
