name: CI
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions: {}
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Install pinned test dependencies
      run: pip install --require-hashes -r .github/requirements-runtime.txt -r .github/requirements-test.txt
    - name: Unit tests
      run: python -m unittest discover -s scripts -p 'test_*.py'
    - name: Offline provider and publication runtime tests
      run: python -m unittest -v scripts.test_review_engine scripts.test_review_jobs
    - name: Native Claude tool and budget dry run (local fixture API)
      run: 'npm install --global @anthropic-ai/claude-code@2.1.312

        claude --version

        python scripts/test_provider_dry_run.py --claude "$(command -v claude)"'
'on':
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
