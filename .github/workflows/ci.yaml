name: CI
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions: {}
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Install pinned test dependencies
      run: pip install --require-hashes -r .github/requirements-runtime.txt -r .github/requirements-test.txt
    - name: Unit tests
      run: python -m unittest discover -s scripts -p 'test_*.py'
    - name: Offline provider and publication runtime tests
      run: python -m unittest -v scripts.test_review_engine scripts.test_review_jobs
    - name: Native Claude tool and budget dry run (local fixture API)
      run: 'npm install --global @anthropic-ai/claude-code@2.1.312

        claude --version

        python scripts/test_provider_dry_run.py --claude "$(command -v claude)"'
  native-codex:
    # The pinned launcher depends on GNU test ACL checks and sudo -E.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: openai/codex-action
        ref: c05cfd74ad95c626cdf05c6685e62becc3bf7813
        path: trusted-codex-action
        persist-credentials: false
    - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
      with:
        node-version: '24'
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Native Codex launcher with fixture executable and no provider credentials
      run: python scripts/test_provider_dry_run.py --codex-action trusted-codex-action
  codex-multisession-proof:
    # Disposable hosted runner only: this job creates an account, a root socket and privileged
    # fixtures. The probe checks the identity; the pinned real CLI then checks its read-only
    # sandbox and native receipt path against a local Responses fixture, without provider credentials.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      REVIEW_PROOF_USER: agent-review-model
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: openai/codex-action
        ref: c05cfd74ad95c626cdf05c6685e62becc3bf7813
        path: trusted-codex-action
        persist-credentials: false
    - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
      with:
        node-version: '24'
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Require the tools the proof and the pinned socket restriction use
      run: |-
        for tool in /usr/bin/sudo /usr/bin/setpriv /usr/bin/setfacl /usr/sbin/setcap /usr/sbin/useradd /usr/bin/pkill; do
          test -x "$tool" || { echo "::error::missing $tool"; exit 1; }
        done
        sudo -n true
        id -un
    - name: Provision the dedicated review account and sessions directory
      run: python scripts/codex_identity_setup.py provision --user "$REVIEW_PROOF_USER"
    - name: Create a root-owned world-writable canary socket
      run: python scripts/hosted_codex_sandbox_proof.py canary-start
    - name: Control, the canary is reachable before socket restriction
      run: python scripts/hosted_codex_sandbox_proof.py canary-probe --user "$REVIEW_PROOF_USER" --expect allowed
    - name: Restrict root sockets with the pinned action's own code, for the review account
      run: python scripts/codex_identity_setup.py restrict-sockets --user "$REVIEW_PROOF_USER" --action trusted-codex-action
    - name: Canary is denied after socket restriction
      run: python scripts/hosted_codex_sandbox_proof.py canary-probe --user "$REVIEW_PROOF_USER" --expect denied
    - name: Launcher identity, isolation and cleanup proof
      run: python scripts/hosted_codex_sandbox_proof.py identity --user "$REVIEW_PROOF_USER" --head "$GITHUB_WORKSPACE"
    - name: Install the pinned native CLI
      run: |
        npm install --global @openai/codex@0.165.0
        "$(npm prefix --global)/bin/codex" --version
    - name: Real native Codex sessions with offline Responses and no provider credentials
      run: python scripts/hosted_codex_sandbox_proof.py native --user "$REVIEW_PROOF_USER" --codex "$(npm prefix --global)/bin/codex"
'on':
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
