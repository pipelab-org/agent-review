  notify-failure:
    name: Report incomplete review
    needs:
    - source
    - admit
    - review
    - publish
    if: |-
      always() && github.event_name == 'issue_comment' && github.event.action == 'created' && github.actor == 'luckyPipewrench' && github.actor_id == '142104046' && github.run_attempt == '1' && github.triggering_actor == 'luckyPipewrench' && github.event.comment.user.login == 'luckyPipewrench' && github.event.comment.user.id == 142104046 && github.event.comment.user.type == 'User' && github.event.comment.author_association == 'MEMBER' && github.event.issue.pull_request && contains(fromJSON('["/review","/review deep","/review codex","/review codex deep"]'), github.event.comment.body) && (needs.source.result == 'failure' || needs.source.result == 'cancelled' ||
          needs.admit.result == 'failure' || needs.admit.result == 'cancelled' ||
          needs.review.result == 'failure' || needs.review.result == 'cancelled' || needs.publish.result == 'failure' || needs.publish.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
    - name: Publish fixed incomplete status for the original eligible request
      env:
        GH_TOKEN: ${{ github.token }}
        REVIEW_DEPTH: ${{ github.event.comment.body == '/review deep' && 'deep' || 'default' }}
        REVIEW_HEAD: ${{ needs.admit.outputs.head }}
        REVIEW_BASE: ${{ needs.admit.outputs.base }}
        ADMISSION_RESULT: ${{ needs.admit.result }}
        REVIEW_OUTCOME_PATH: ${{ runner.temp }}/agent-review-notifier/outcome.json
      shell: bash
      run: |
        python3 - <<'PY'
        import json
        import os
        import re
        import time
        import urllib.request

        # The operation in progress, from a fixed vocabulary, for the failure record.
        where = ["start"]


        def record(error):
            """Allowlisted facts about a failed notification, kept even if no comment can be posted.

            The same schema and rules as scripts/review_reliability.py, which this host-only
            step cannot import: status code, validated rate-limit headers, exception class.
            """
            status = getattr(error, "code", None)
            status = status if type(status) is int and 100 <= status <= 599 else None
            try:
                raw = {str(k).lower(): v for k, v in getattr(error, "headers", None).items()}
            except AttributeError:
                raw = {}
            rate, bad = {}, []
            for name, key in (("x-ratelimit-limit", "limit"), ("x-ratelimit-remaining", "remaining"),
                              ("x-ratelimit-used", "used"), ("x-ratelimit-reset", "reset"),
                              ("retry-after", "retry_after_seconds")):
                if name in raw:
                    if isinstance(raw[name], str) and re.fullmatch(r"[0-9]{1,12}", raw[name]):
                        rate[key] = int(raw[name])
                    else:
                        bad.append(name)
            resource = raw.get("x-ratelimit-resource")
            if isinstance(resource, str) and re.fullmatch(r"[a-z][a-z0-9_]{0,31}", resource):
                rate["resource"] = resource
            elif resource is not None:
                bad.append("x-ratelimit-resource")
            if "reset" in rate:
                rate["reset_in_seconds"] = max(rate["reset"] - int(time.time()), 0)
            if bad:
                rate["malformed"] = sorted(bad)
            if status in (403, 429) and rate.get("remaining") == 0:
                category = "rate_limit_primary"
            elif status in (403, 429) and (status == 429 or "retry_after_seconds" in rate or "retry-after" in bad):
                category = "rate_limit_unknown"
            elif status is None:
                category = "network" if isinstance(error, OSError) else "unexpected"
            elif status >= 500:
                category = "server_error"
            else:
                category = {401: "authentication", 403: "forbidden", 404: "not_found",
                            422: "validation"}.get(status, "client_error")
            name = type(error).__name__
            failure = {"phase": "notification", "stage": where[0], "category": category,
                       "exception": name if re.fullmatch(r"[A-Za-z_][A-Za-z0-9_]{0,63}", name) else "Exception"}
            if status is not None:
                failure["status"] = status
            if rate:
                failure["rate_limit"] = rate
            result = {"schema": "agent-review-outcome:v1", "result": "failed", "failure": failure}
            path, sink = os.environ.get("REVIEW_OUTCOME_PATH"), os.environ.get("GITHUB_STEP_SUMMARY")
            try:
                if path:
                    os.makedirs(os.path.dirname(path), mode=0o700, exist_ok=True)
                    with open(path, "w", encoding="utf-8") as stream:
                        json.dump(result, stream, sort_keys=True, separators=(",", ":"))
                    os.chmod(path, 0o600)
                if sink:
                    cells = [("Stage", failure["stage"]), ("Category", category), ("HTTP status", status),
                             ("Exception class", failure["exception"]), ("Rate-limit remaining", rate.get("remaining")),
                             ("Rate-limit reset (UTC epoch)", rate.get("reset")),
                             ("Seconds until reset at capture", rate.get("reset_in_seconds")),
                             ("Retry-After seconds", rate.get("retry_after_seconds"))]
                    with open(sink, "a", encoding="utf-8") as stream:
                        stream.write("### Agent review notification failed\n\n| Field | Value |\n| --- | --- |\n"
                                     + "".join(f"| {label} | {value} |\n" for label, value in cells if value is not None))
            except OSError:
                pass


        def main():
            with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as stream:
                event = json.load(stream)
            comment = event.get("comment", {})
            user = comment.get("user", {})
            issue = event.get("issue", {})
            if not (os.environ["GITHUB_EVENT_NAME"] == "issue_comment" and event.get("action") == "created"
                    and os.environ["GITHUB_ACTOR"] == "luckyPipewrench"
                    and os.environ["GITHUB_ACTOR_ID"] == "142104046"
                    and os.environ["GITHUB_TRIGGERING_ACTOR"] == "luckyPipewrench"
                    and os.environ["GITHUB_RUN_ATTEMPT"] == "1"
                    and user.get("login") == "luckyPipewrench" and user.get("id") == 142104046
                    and user.get("type") == "User" and comment.get("author_association") == "MEMBER"
                    and comment.get("body") in ("/review", "/review deep", "/review codex", "/review codex deep") and issue.get("pull_request")):
                return
            repo, number, run_id = os.environ["GITHUB_REPOSITORY"], issue.get("number"), os.environ["GITHUB_RUN_ID"]
            if (not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo)
                    or repo != event.get("repository", {}).get("full_name")
                    or type(number) is not int or number <= 0
                    or not re.fullmatch(r"[1-9][0-9]*", run_id)):
                raise ValueError("Invalid notification identity")

            def api(stage, method, path, data=None):
                where[0] = stage
                request = urllib.request.Request(
                    "https://api.github.com/" + path, method=method,
                    headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                             "Accept": "application/vnd.github+json", "Content-Type": "application/json"},
                    data=json.dumps(data).encode() if data is not None else None)
                with urllib.request.urlopen(request) as response:
                    return json.load(response)

            prefix = f"repos/{repo}"
            # Re-read eligibility even if admission failed before returning its outputs.
            pr = api("read_pull_request", "GET", f"{prefix}/pulls/{number}")
            if not (pr["state"] == "open" and pr["head"]["repo"] is not None
                    and pr["head"]["repo"]["fork"] is False
                    and pr["head"]["repo"]["full_name"] == repo and pr["base"]["repo"]["full_name"] == repo):
                return
            head, base = os.environ.get("REVIEW_HEAD", ""), os.environ.get("REVIEW_BASE", "")
            captured = bool(re.fullmatch(r"[0-9a-f]{40}", head) and re.fullmatch(r"[0-9a-f]{40}", base))
            marker = f"<!-- agent-review-notice:v1 run={run_id} -->"
            if captured and (head != pr["head"]["sha"] or base != pr["base"]["sha"]):
                message = "The requested diff review didn't complete because the commits changed. Post a new command on the current snapshot."
            elif os.environ["ADMISSION_RESULT"] != "success" or not captured:
                message = "The requested diff review never started. Treat this run as incomplete."
            else:
                message = "The requested diff review didn't complete. Treat this run as incomplete."
            body = marker + "\n" + message
            if captured:
                body += f"\n\nCaptured base `{base}` and head `{head}`."
            body += f"\n\n[Actions run](https://github.com/{repo}/actions/runs/{run_id})."
            page = 1
            while True:
                comments = api("list_comments", "GET", f"{prefix}/issues/{number}/comments?per_page=100&page={page}")
                for item in comments:
                    author = item.get("user", {})
                    if (author.get("login") == "github-actions[bot]" and author.get("type") == "Bot"
                            and marker in item.get("body", "").splitlines()):
                        if type(item.get("id")) is not int or item["id"] <= 0:
                            raise ValueError("Invalid notification comment")
                        api("update_comment", "PATCH", f"{prefix}/issues/comments/{item['id']}", {"body": body})
                        return
                if len(comments) < 100:
                    break
                page += 1
            api("create_comment", "POST", f"{prefix}/issues/{number}/comments", {"body": body})


        try:
            main()
        except Exception as error:
            # Never echo API errors, model output, credentials, or repository text.
            # The allowlisted record goes to the step summary and a local file only.
            record(error)
            raise SystemExit("Review failure notification failed; inspect Actions status") from None
        PY
    - name: Preserve notification failure diagnostics
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: agent-review-notifier-outcome
        path: ${{ runner.temp }}/agent-review-notifier/outcome.json
        if-no-files-found: ignore
        overwrite: 'true'
  publish:
    name: Publish verified review
    needs:
    - source
    - admit
    - review
    if: needs.review.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      pull-requests: write
      issues: write
    concurrency:
      group: agent-review-${{ github.repository }}-${{ github.event.issue.number }}-publication
      cancel-in-progress: false
      queue: max
    steps:
    - name: Check out trusted base at workspace root
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ${{ github.repository }}
        ref: ${{ github.workflow_sha }}
        persist-credentials: false
        fetch-depth: 0
    - name: Check out immutable agent-review source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: pipelab-org/agent-review
        ref: ${{ needs.source.outputs.reviewer_sha }}
        path: trusted-agent-review
        persist-credentials: 'false'
    - name: Check out caller policy as data from its loaded default-branch revision
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ${{ github.repository }}
        ref: ${{ github.workflow_sha }}
        path: trusted-agent-profile
        persist-credentials: 'false'
        sparse-checkout: |
          .github/agent-review.toml
          .github/workflows/agent-review.yaml
        sparse-checkout-cone-mode: 'false'
    - name: Validate the trusted caller and restricted profile before inference
      env:
        CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
        REVIEW_SOURCE_SHA: ${{ needs.source.outputs.reviewer_sha }}
      run: python trusted-agent-review/scripts/agent_review_contract.py --root trusted-agent-profile --source-sha "$REVIEW_SOURCE_SHA"
    - name: Check out immutable head as read-only data
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ${{ github.repository }}
        ref: ${{ needs.admit.outputs.head }}
        path: pr-head
        persist-credentials: false
        fetch-depth: 0
    - name: Set up the Python version the pinned dependencies were hashed for
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Install pinned engine dependencies
      run: pip install --require-hashes -r trusted-agent-review/.github/requirements-runtime.txt
    - name: Download this run's inference artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
