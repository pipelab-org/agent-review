name: Reusable agentic review
'on':
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      ANTHROPIC_API_KEY_2:
        required: false
      OPENAI_API_KEY:
        required: false
      ORG_MEMBERS_TOKEN:
        required: false
      AGENT_REVIEW_LEARNINGS_APP_ID:
        required: false
      AGENT_REVIEW_LEARNINGS_APP_KEY:
        required: false
permissions: {}
jobs:
  source:
    if: (github.event_name == 'issue_comment' && github.event.action == 'created' && github.actor == 'luckyPipewrench' && github.actor_id == '142104046' && github.run_attempt == '1' && github.triggering_actor == 'luckyPipewrench' && github.event.comment.user.login == 'luckyPipewrench' && github.event.comment.user.id == 142104046 && github.event.comment.user.type == 'User' && github.event.comment.author_association == 'MEMBER' && github.event.issue.pull_request && contains(fromJSON('["/review","/review deep","/review codex","/review codex deep"]'), github.event.comment.body)) || (github.event_name == 'pull_request_review_comment' && github.event.action == 'created' && github.run_attempt == '1' && github.actor == github.event.comment.user.login && github.triggering_actor == github.actor && github.event.comment.user.type == 'User' && github.event.comment.in_reply_to_id)
    permissions: {}
    uses: ./.github/workflows/agent-review-source.yaml
  admit:
    needs: source
    name: Admit maintainer command
    if: github.event_name == 'issue_comment' && github.event.action == 'created' && github.actor == 'luckyPipewrench' && github.actor_id == '142104046' && github.run_attempt == '1' && github.triggering_actor == 'luckyPipewrench' && github.event.comment.user.login == 'luckyPipewrench' && github.event.comment.user.id == 142104046 && github.event.comment.user.type == 'User' && github.event.comment.author_association == 'MEMBER' && github.event.issue.pull_request && contains(fromJSON('["/review","/review deep","/review codex","/review codex deep"]'), github.event.comment.body)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      admitted: ${{ steps.pr.outputs.admitted }}
      head: ${{ steps.pr.outputs.head }}
      base: ${{ steps.pr.outputs.base }}
    steps:
    - name: Reject fork and closed pull requests before provider admission
      id: pr
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.issue.number }}
        REVIEW_COMMAND: ${{ github.event.comment.body }}
      run: |
        set -euo pipefail
        # GitHub expression string comparisons ignore case. Shell admission
        # enforces the exact commands before any provider work.
        case "$REVIEW_COMMAND" in
          /review|'/review deep'|'/review codex'|'/review codex deep') ;;
          *) exit 0 ;;
        esac
        pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
        if ! jq -e --arg repo "$GITHUB_REPOSITORY" '
          .state == "open" and .head.repo.fork == false and
          .head.repo.full_name == $repo and .base.repo.full_name == $repo
        ' <<< "$pr" >/dev/null; then
          echo 'Review refused: pull request is closed or from a fork; no secrets or provider work admitted.' >&2
          exit 1
        fi
        head="$(jq -er '.head.sha' <<< "$pr")"
        base="$(jq -er '.base.sha' <<< "$pr")"
        [[ "$head" =~ ^[0-9a-f]{40}$ && "$base" =~ ^[0-9a-f]{40}$ ]]
        printf 'admitted=true\nhead=%s\nbase=%s\n' "$head" "$base" >> "$GITHUB_OUTPUT"
  review:
    name: Review admitted diff
    needs:
    - source
    - admit
    if: needs.admit.outputs.admitted == 'true'
    concurrency:
      group: agent-review-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      learnings_identity: ${{ steps.plan.outputs.learnings_identity }}
    steps:
    - name: Check out trusted base at workspace root
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ${{ github.repository }}
        ref: ${{ github.workflow_sha }}
        persist-credentials: false
        fetch-depth: 0
    - name: Check out immutable agent-review source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: pipelab-org/agent-review
        ref: ${{ needs.source.outputs.reviewer_sha }}
        path: trusted-agent-review
        persist-credentials: 'false'
    - name: Check out caller policy as data from its loaded default-branch revision
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ${{ github.repository }}
        ref: ${{ github.workflow_sha }}
        path: trusted-agent-profile
        persist-credentials: 'false'
        sparse-checkout: |
          .github/agent-review.toml
          .github/workflows/agent-review.yaml
        sparse-checkout-cone-mode: 'false'
    - name: Validate the trusted caller and restricted profile before inference
      env:
        CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
        REVIEW_SOURCE_SHA: ${{ needs.source.outputs.reviewer_sha }}
      run: python trusted-agent-review/scripts/agent_review_contract.py --root trusted-agent-profile --source-sha "$REVIEW_SOURCE_SHA"
    - name: Check out immutable head as read-only data
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ${{ github.repository }}
        ref: ${{ needs.admit.outputs.head }}
        path: pr-head
        persist-credentials: false
        fetch-depth: 0
    - name: Set up the Python version the pinned dependencies were hashed for
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Install pinned engine dependencies
      run: pip install --require-hashes -r trusted-agent-review/.github/requirements-runtime.txt
    - name: Check optional learnings credentials
      id: learnings-credentials
      env:
        APP_ID: ${{ secrets.AGENT_REVIEW_LEARNINGS_APP_ID }}
        APP_KEY: ${{ secrets.AGENT_REVIEW_LEARNINGS_APP_KEY }}
      run: |
        if [[ -n "$APP_ID" && -n "$APP_KEY" ]]; then
          echo 'available=true' >> "$GITHUB_OUTPUT"
        else
          echo 'available=false' >> "$GITHUB_OUTPUT"
        fi
    - name: Mint read-only token for the learnings repository only
      id: learnings-token
      if: steps.learnings-credentials.outputs.available == 'true'
      continue-on-error: true
      # https://github.com/actions/create-github-app-token/releases/tag/v3.3.0
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        app-id: ${{ secrets.AGENT_REVIEW_LEARNINGS_APP_ID }}
        private-key: ${{ secrets.AGENT_REVIEW_LEARNINGS_APP_KEY }}
        owner: pipelab-org
        repositories: agent-review-learnings
        permission-contents: read
        permission-metadata: read
    - name: Fetch optional learnings at one immutable revision
      id: learnings-fetch
      continue-on-error: true
      env:
        LEARNINGS_TOKEN: ${{ steps.learnings-token.outputs.token }}
        LEARNINGS_CREDENTIALS: ${{ steps.learnings-credentials.outputs.available }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        REVIEW_DEPTH: ${{ github.event.comment.body == '/review codex deep' && 'codex-deep' || github.event.comment.body == '/review codex' && 'codex' || github.event.comment.body == '/review deep' && 'deep' || 'default' }}
      run: python trusted-agent-review/scripts/review_learnings.py --fetch
    - name: Prepare admitted snapshot
      id: plan
      run: python trusted-agent-review/scripts/review_jobs.py prepare --head pr-head --output "$RUNNER_TEMP/agent-review/plan.json"
      env:
        REVIEW_LEARNINGS_DIR: ${{ steps.learnings-fetch.outputs.directory }}
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.issue.number }}
        REVIEW_SOURCE_SHA: ${{ needs.source.outputs.reviewer_sha }}
        REVIEW_PROFILE_SHA: ${{ github.workflow_sha }}
        REVIEW_PROFILE_PATH: trusted-agent-profile/.github/agent-review.toml
        REVIEW_DEPTH: ${{ github.event.comment.body == '/review codex deep' && 'codex-deep' || github.event.comment.body == '/review codex' && 'codex' || github.event.comment.body == '/review deep' && 'deep' || 'default' }}
        REVIEW_HEAD: ${{ needs.admit.outputs.head }}
        REVIEW_BASE: ${{ needs.admit.outputs.base }}
        REVIEW_OUTCOME_PATH: ${{ runner.temp }}/agent-review-outcome/outcome.json
    - name: Install pinned Claude CLI
      if: ${{ !startsWith(env.REVIEW_DEPTH, 'codex') }}
      run: |-
        npm install --global @anthropic-ai/claude-code@2.1.312
        claude --version
      env:
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.issue.number }}
        REVIEW_SOURCE_SHA: ${{ needs.source.outputs.reviewer_sha }}
        REVIEW_PROFILE_SHA: ${{ github.workflow_sha }}
        REVIEW_PROFILE_PATH: trusted-agent-profile/.github/agent-review.toml
        REVIEW_DEPTH: ${{ github.event.comment.body == '/review codex deep' && 'codex-deep' || github.event.comment.body == '/review codex' && 'codex' || github.event.comment.body == '/review deep' && 'deep' || 'default' }}
        REVIEW_HEAD: ${{ needs.admit.outputs.head }}
        REVIEW_BASE: ${{ needs.admit.outputs.base }}
        REVIEW_OUTCOME_PATH: ${{ runner.temp }}/agent-review-outcome/outcome.json
    - name: Check out pinned Codex action runner
      if: ${{ startsWith(env.REVIEW_DEPTH, 'codex') }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: openai/codex-action
        ref: c05cfd74ad95c626cdf05c6685e62becc3bf7813
        path: trusted-codex-action
        persist-credentials: false
      env:
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.issue.number }}
        REVIEW_SOURCE_SHA: ${{ needs.source.outputs.reviewer_sha }}
        REVIEW_PROFILE_SHA: ${{ github.workflow_sha }}
        REVIEW_PROFILE_PATH: trusted-agent-profile/.github/agent-review.toml
        REVIEW_DEPTH: ${{ github.event.comment.body == '/review codex deep' && 'codex-deep' || github.event.comment.body == '/review codex' && 'codex' || github.event.comment.body == '/review deep' && 'deep' || 'default' }}
        REVIEW_HEAD: ${{ needs.admit.outputs.head }}
        REVIEW_BASE: ${{ needs.admit.outputs.base }}
        REVIEW_OUTCOME_PATH: ${{ runner.temp }}/agent-review-outcome/outcome.json
    - name: Prepare trusted Codex home
      if: ${{ startsWith(env.REVIEW_DEPTH, 'codex') }}
      run: |-
        mkdir -p "$RUNNER_TEMP/agent-review-codex-home"
        cp trusted-agent-review/.github/codex-config.toml "$RUNNER_TEMP/agent-review-codex-home/config.toml"
      env:
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.issue.number }}
        REVIEW_SOURCE_SHA: ${{ needs.source.outputs.reviewer_sha }}
        REVIEW_PROFILE_SHA: ${{ github.workflow_sha }}
        REVIEW_PROFILE_PATH: trusted-agent-profile/.github/agent-review.toml
        REVIEW_DEPTH: ${{ github.event.comment.body == '/review codex deep' && 'codex-deep' || github.event.comment.body == '/review codex' && 'codex' || github.event.comment.body == '/review deep' && 'deep' || 'default' }}
        REVIEW_HEAD: ${{ needs.admit.outputs.head }}
        REVIEW_BASE: ${{ needs.admit.outputs.base }}
        REVIEW_OUTCOME_PATH: ${{ runner.temp }}/agent-review-outcome/outcome.json
    - name: Set up pinned read-only Codex runtime
      if: ${{ startsWith(env.REVIEW_DEPTH, 'codex') }}
      uses: openai/codex-action@c05cfd74ad95c626cdf05c6685e62becc3bf7813
      with:
        openai-api-key: ${{ secrets.OPENAI_API_KEY }}
        permission-profile: :read-only
        codex-version: 0.165.0
        codex-home: ${{ runner.temp }}/agent-review-codex-home
        output-schema-file: trusted-agent-review/.github/review-output.schema.json
        # Setup-only must keep sudo. The engine's run-codex-exec drop-sudo removes it
        # at launch and starts Codex under setpriv with no_new_privs and no capabilities;
        # a setup-time drop makes that launch refuse to start.
        safety-strategy: read-only
      env:
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.issue.number }}
        REVIEW_SOURCE_SHA: ${{ needs.source.outputs.reviewer_sha }}
        REVIEW_PROFILE_SHA: ${{ github.workflow_sha }}
        REVIEW_PROFILE_PATH: trusted-agent-profile/.github/agent-review.toml
        REVIEW_DEPTH: ${{ github.event.comment.body == '/review codex deep' && 'codex-deep' || github.event.comment.body == '/review codex' && 'codex' || github.event.comment.body == '/review deep' && 'deep' || 'default' }}
        REVIEW_HEAD: ${{ needs.admit.outputs.head }}
        REVIEW_BASE: ${{ needs.admit.outputs.base }}
        REVIEW_OUTCOME_PATH: ${{ runner.temp }}/agent-review-outcome/outcome.json
    - name: Review the admitted diff
      env:
        REVIEW_LEARNINGS_DIR: ${{ steps.learnings-fetch.outputs.directory }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.issue.number }}
        REVIEW_SOURCE_SHA: ${{ needs.source.outputs.reviewer_sha }}
        REVIEW_PROFILE_SHA: ${{ github.workflow_sha }}
        REVIEW_PROFILE_PATH: trusted-agent-profile/.github/agent-review.toml
        REVIEW_DEPTH: ${{ github.event.comment.body == '/review codex deep' && 'codex-deep' || github.event.comment.body == '/review codex' && 'codex' || github.event.comment.body == '/review deep' && 'deep' || 'default' }}
        REVIEW_HEAD: ${{ needs.admit.outputs.head }}
        REVIEW_BASE: ${{ needs.admit.outputs.base }}
        REVIEW_OUTCOME_PATH: ${{ runner.temp }}/agent-review-outcome/outcome.json
        # A Codex pass can run read-only shell commands and read process environments.
        # It authenticates through the action's proxy, so it never receives this key.
        ANTHROPIC_API_KEY: ${{ !startsWith(env.REVIEW_DEPTH, 'codex') && secrets.ANTHROPIC_API_KEY || '' }}
      run: python trusted-agent-review/scripts/review_jobs.py infer --head pr-head --input "$RUNNER_TEMP/agent-review/plan.json" --output "$RUNNER_TEMP/agent-review/findings.json" --codex-action trusted-codex-action --codex-home "$RUNNER_TEMP/agent-review-codex-home"
    - name: Preserve findings and complete pass receipts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: agent-review-findings
        path: ${{ runner.temp }}/agent-review/findings.json
        if-no-files-found: error
      env:
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.issue.number }}
        REVIEW_SOURCE_SHA: ${{ needs.source.outputs.reviewer_sha }}
        REVIEW_PROFILE_SHA: ${{ github.workflow_sha }}
        REVIEW_PROFILE_PATH: trusted-agent-profile/.github/agent-review.toml
        REVIEW_DEPTH: ${{ github.event.comment.body == '/review codex deep' && 'codex-deep' || github.event.comment.body == '/review codex' && 'codex' || github.event.comment.body == '/review deep' && 'deep' || 'default' }}
        REVIEW_HEAD: ${{ needs.admit.outputs.head }}
        REVIEW_BASE: ${{ needs.admit.outputs.base }}
        REVIEW_OUTCOME_PATH: ${{ runner.temp }}/agent-review-outcome/outcome.json
    - name: Preserve allowlisted outcome
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: agent-review-outcome
        path: ${{ runner.temp }}/agent-review-outcome/outcome.json
        if-no-files-found: ignore
        overwrite: true
      env:
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.issue.number }}
        REVIEW_SOURCE_SHA: ${{ needs.source.outputs.reviewer_sha }}
        REVIEW_PROFILE_SHA: ${{ github.workflow_sha }}
        REVIEW_PROFILE_PATH: trusted-agent-profile/.github/agent-review.toml
        REVIEW_DEPTH: ${{ github.event.comment.body == '/review codex deep' && 'codex-deep' || github.event.comment.body == '/review codex' && 'codex' || github.event.comment.body == '/review deep' && 'deep' || 'default' }}
        REVIEW_HEAD: ${{ needs.admit.outputs.head }}
        REVIEW_BASE: ${{ needs.admit.outputs.base }}
        REVIEW_OUTCOME_PATH: ${{ runner.temp }}/agent-review-outcome/outcome.json
    env:
      REVIEW_DEPTH: ${{ github.event.comment.body == '/review codex deep' && 'codex-deep' || github.event.comment.body == '/review codex' && 'codex' || github.event.comment.body == '/review deep' && 'deep' || 'default' }}
  reply:
    name: Answer an inline review question
    needs: source
    if: github.event_name == 'pull_request_review_comment' && github.event.action == 'created' && github.run_attempt == '1' && github.actor == github.event.comment.user.login && github.triggering_actor == github.actor && github.event.comment.user.type == 'User' && github.event.comment.in_reply_to_id
    concurrency:
      group: agent-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      learnings_identity: ${{ steps.plan.outputs.learnings_identity }}
    steps:
    - name: Resolve trusted shared source before checkout
      id: reply-source
      env:
        GITHUB_TOKEN: ${{ github.token }}
        LOADED_REVIEW_SOURCE_SHA: ${{ needs.source.outputs.reviewer_sha }}
      run: |
        python3 - <<'PY'
        import json
        import os
        import re
        import urllib.parse
        import urllib.request


        def main():
            sha = os.environ["LOADED_REVIEW_SOURCE_SHA"]
            if os.environ["GITHUB_REPOSITORY"] == "pipelab-org/agent-review":
                root = "https://api.github.com/repos/pipelab-org/agent-review"

                def read(url):
                    request = urllib.request.Request(url, headers={
                        "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                        "Accept": "application/vnd.github+json"})
                    with urllib.request.urlopen(request) as response:
                        return json.load(response)

                branch = read(root)["default_branch"]
                sha = read(root + "/commits/" + urllib.parse.quote(branch, safe=""))["sha"]
            if not isinstance(sha, str) or not re.fullmatch(r"[0-9a-f]{40}", sha):
                raise ValueError("Invalid trusted source")
            with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
                stream.write(f"reviewer_sha={sha}\n")


        try:
            main()
        except Exception:
            raise SystemExit("Trusted reply source unavailable; no repository code executed") from None
        PY
    - name: Check out trusted base at workspace root
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ${{ github.repository }}
        ref: ${{ github.event.pull_request.base.sha }}
        persist-credentials: false
        fetch-depth: 0
    - name: Check out immutable agent-review source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: pipelab-org/agent-review
        ref: ${{ steps.reply-source.outputs.reviewer_sha }}
        path: trusted-agent-review
        persist-credentials: 'false'
    - name: Set up the Python version the pinned dependencies were hashed for
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Install pinned engine dependencies before importing them
      run: pip install --require-hashes -r trusted-agent-review/.github/requirements-runtime.txt
    - name: Resolve immutable default-branch policy and validate the loaded caller as data
      id: policy
      env:
        GITHUB_TOKEN: ${{ github.token }}
        REVIEW_SOURCE_SHA: ${{ steps.reply-source.outputs.reviewer_sha }}
        CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
        CALLER_WORKFLOW_SHA: ${{ github.workflow_sha }}
      run: python trusted-agent-review/scripts/agent_review_contract.py --resolve-reply-policy --source-sha "$REVIEW_SOURCE_SHA"
    - name: Check out caller policy as data from its loaded default-branch revision
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ${{ github.repository }}
        ref: ${{ steps.policy.outputs.sha }}
        path: trusted-agent-profile
        persist-credentials: 'false'
        sparse-checkout: |
          .github/agent-review.toml
          .github/workflows/agent-review.yaml
        sparse-checkout-cone-mode: 'false'
    - name: Validate the trusted caller and restricted profile before inference
      env:
        CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
        REVIEW_SOURCE_SHA: ${{ steps.reply-source.outputs.reviewer_sha }}
      run: python trusted-agent-review/scripts/agent_review_contract.py --root trusted-agent-profile --source-sha "$REVIEW_SOURCE_SHA"
    - name: Check out immutable head as read-only data
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ${{ github.repository }}
        ref: ${{ github.event.pull_request.head.sha }}
        path: pr-head
        persist-credentials: false
        fetch-depth: 0
    - name: Check optional learnings credentials
      id: learnings-credentials
      env:
        APP_ID: ${{ secrets.AGENT_REVIEW_LEARNINGS_APP_ID }}
        APP_KEY: ${{ secrets.AGENT_REVIEW_LEARNINGS_APP_KEY }}
      run: |
        if [[ -n "$APP_ID" && -n "$APP_KEY" ]]; then
          echo 'available=true' >> "$GITHUB_OUTPUT"
        else
          echo 'available=false' >> "$GITHUB_OUTPUT"
        fi
    - name: Mint read-only token for the learnings repository only
      id: learnings-token
      if: steps.learnings-credentials.outputs.available == 'true'
      continue-on-error: true
      # https://github.com/actions/create-github-app-token/releases/tag/v3.3.0
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        app-id: ${{ secrets.AGENT_REVIEW_LEARNINGS_APP_ID }}
        private-key: ${{ secrets.AGENT_REVIEW_LEARNINGS_APP_KEY }}
        owner: pipelab-org
        repositories: agent-review-learnings
        permission-contents: read
        permission-metadata: read
    - name: Fetch optional learnings at one immutable revision
      id: learnings-fetch
      continue-on-error: true
      env:
        LEARNINGS_TOKEN: ${{ steps.learnings-token.outputs.token }}
        LEARNINGS_CREDENTIALS: ${{ steps.learnings-credentials.outputs.available }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        REVIEW_DEPTH: default
      run: python trusted-agent-review/scripts/review_learnings.py --fetch
    - name: Prepare admitted snapshot
      id: plan
      run: python trusted-agent-review/scripts/review_jobs.py prepare --head pr-head --output "$RUNNER_TEMP/agent-review/plan.json" --reply
      env:
        REVIEW_LEARNINGS_DIR: ${{ steps.learnings-fetch.outputs.directory }}
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REVIEW_SOURCE_SHA: ${{ steps.reply-source.outputs.reviewer_sha }}
        REVIEW_PROFILE_SHA: ${{ steps.policy.outputs.sha }}
        REVIEW_PROFILE_PATH: trusted-agent-profile/.github/agent-review.toml
        REVIEW_DEPTH: default
        REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
        REVIEW_BASE: ${{ github.event.pull_request.base.sha }}
        REVIEW_OUTCOME_PATH: ${{ runner.temp }}/agent-review-outcome/outcome.json
        ORG_MEMBERS_TOKEN: ${{ secrets.ORG_MEMBERS_TOKEN }}
    - name: Install pinned Claude CLI
      run: |-
        npm install --global @anthropic-ai/claude-code@2.1.312
